<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="assets/symbols.css">
<link rel="stylesheet" href="prototype.css">
</head>
<body>

<header class="board-head">
  <h1>Snug 界面原型 · 多屏</h1>
  <nav>
    <a href="#mac">Mac 上</a>
    <a href="#touch">Snug 屏上</a>
    <a href="#resolution">分辨率</a>
  </nav>
  <nav aria-label="外观">
    <button data-theme-set="light">浅色</button>
    <button data-theme-set="dark">深色</button>
    <button data-theme-set="system" aria-pressed="true">跟随系统</button>
  </nav>
</header>

<main>

<!-- ===================================================== Mac 上 ===================================================== -->
<section class="board-section mac" id="mac">
  <h2>Mac 上</h2>
  <p>天天看的放菜单栏，偶尔改的放设置。设置分三页：屏幕、触控、通用；只管某一块屏的（型号、名字）放进那块屏的详情。</p>

  <div class="frames">

    <!-- 菜单栏菜单 -->
    <figure class="frame">
      <div class="desktop">
        <div class="menubar">
          <span class="on"><i class="sym" data-s="iphone.radiowaves.left.and.right"></i></span>
          <i class="sym" data-s="magnifyingglass"></i>
          <span>11月17日 周二 21:05</span>
        </div>
        <div class="menu">
          <div class="head">
            <span class="tile" style="--c: var(--mac-status-remote)"><i class="sym" data-s="iphone.radiowaves.left.and.right"></i></span>
            <div>远程中 · iPhone 17 Pro Max<small>正在看「Snug 手机屏」</small></div>
          </div>
          <hr>
          <div class="mi"><i class="sym" data-s="gearshape"></i>设置…<kbd>⌘,</kbd></div>
          <div class="mi"><i class="sym" data-s="info.circle"></i>关于 Snug</div>
          <hr>
          <div class="mi"><i class="sym" data-s="power"></i>退出 Snug<kbd>⌘Q</kbd></div>
        </div>
      </div>
      <figcaption><b>菜单栏菜单</b>顶上一行说清此刻的状态。电脑屏的 App 资源库从屏幕左边缘的小竖条打开，不在菜单里（菜单栏图标藏在上面难找，全屏的 App 里还看不到）。</figcaption>
    </figure>

    <!-- 设置 · 屏幕 -->
    <figure class="frame">
      <div class="window">
        <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><span class="title">屏幕</span></div>
        <div class="tabs" role="tablist">
          <button class="tab" role="tab" aria-selected="true"><i class="sym" data-s="rectangle.on.rectangle"></i>屏幕</button>
          <button class="tab" role="tab"><i class="sym" data-s="hand.point.up.left"></i>触控</button>
          <button class="tab" role="tab"><i class="sym" data-s="gearshape"></i>通用</button>
        </div>
        <div class="pane">
          <div class="group">
            <div class="row status-row">
              <span class="tile status-tile" style="--c: var(--mac-status-remote)"><i class="sym" data-s="iphone.radiowaves.left.and.right"></i></span>
              <div class="text"><b>iPhone 17 Pro Max · 远程中</b><span class="detail">正在看「Snug 手机屏」</span></div>
            </div>
          </div>

          <div class="group-title">屏幕</div>
          <div class="group">
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-screen)"><i class="sym" data-s="iphone"></i></span>
              <div class="text">Snug 手机屏<span class="detail">竖 · iPhone 17 Pro Max</span></div>
              <span class="badge"><span class="dot"></span>在看</span>
              <span class="toggle" role="switch" aria-checked="true"></span>
              <i class="sym info" data-s="info.circle" title="详情"></i>
            </div>
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-screen)"><i class="sym" data-s="ipad.landscape"></i></span>
              <div class="text">Snug iPad<span class="detail">横 · iPad（第 10 代）</span></div>
              <span class="toggle" role="switch" aria-checked="true"></span>
              <i class="sym info" data-s="info.circle" title="详情"></i>
            </div>
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-screen)"><i class="sym" data-s="laptopcomputer"></i></span>
              <div class="text">Snug MacBook Air<span class="detail">横 · MacBook Air 13（M4）</span></div>
              <span class="toggle" role="switch" aria-checked="false"></span>
              <i class="sym info" data-s="info.circle" title="详情"></i>
            </div>
          </div>
          <div class="list-foot">
            <div class="foot-line">同一时间只用到一块屏，用不到的可以关掉。<span class="help-anchor"><button class="foot-link" aria-expanded="true">为什么？</button>
              <div class="popover" role="dialog" aria-label="可以开几块屏">
                <b>可以开几块屏</b>
                <p>同一时间只推一块屏。多开的屏留给：</p>
                <div class="pop-row">
                  <i class="sym" data-s="rectangle.portrait.rotate"></i>
                  <div><b>横竖切换</b><span>同一台设备横竖各一块，转过来在远控里切</span></div>
                </div>
                <div class="pop-row">
                  <i class="sym" data-s="arrow.left.arrow.right"></i>
                  <div><b>换设备</b><span>另一台接管后直接选它的屏，不用改设置</span></div>
                </div>
                <p class="pop-foot">关着的屏远程时不建，远控的屏幕列表也更短。</p>
              </div>
            </span></div>
            <span class="button"><i class="sym" data-s="plus"></i>添加屏幕…</span>
          </div>

          <div class="group">
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-main-screen)"><i class="sym" data-s="menubar.rectangle"></i></span>
              <div class="text">设为主屏<span class="detail">远程时用这块屏当主屏，结束后还原</span></div>
              <span class="popup">不改<i class="sym" data-s="chevron.up.chevron.down"></i></span>
            </div>
          </div>
        </div>
      </div>
      <figcaption><b>设置 · 屏幕</b>原来一页到底的内容拆开。这一页只管「有哪几块屏、开不开、用哪块当主屏」；点 ⓘ 进那块屏的详情。正在看的屏标「在看」。列表下面一行写结论，末尾的「为什么？」点开看理由（这里画的是点开的样子）。</figcaption>
    </figure>

    <!-- 添加屏幕 -->
    <figure class="frame">
      <div class="sheet-host">
        <div class="window">
          <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><span class="title">屏幕</span></div>
          <div class="tabs"><button class="tab" aria-selected="true"><i class="sym" data-s="rectangle.on.rectangle"></i>屏幕</button><button class="tab"><i class="sym" data-s="hand.point.up.left"></i>触控</button><button class="tab"><i class="sym" data-s="gearshape"></i>通用</button></div>
          <div class="pane" style="height: 360px"></div>
        </div>
        <div class="dim"></div>
        <div class="sheet">
          <h3>添加屏幕</h3>
          <div class="group">
            <div class="row plain">
              <div class="text">设备</div>
              <span class="segmented">
                <span><i class="sym" data-s="iphone"></i>手机</span>
                <span aria-selected="true"><i class="sym" data-s="ipad"></i>平板</span>
                <span><i class="sym" data-s="laptopcomputer"></i>电脑</span>
              </span>
            </div>
            <div class="row plain">
              <div class="text">方向<span class="detail">添加后不能改</span></div>
              <span class="segmented">
                <span><i class="sym" data-s="rectangle.portrait"></i>竖</span>
                <span aria-selected="true"><i class="sym" data-s="rectangle"></i>横</span>
              </span>
            </div>
            <div class="row plain">
              <div class="text">型号</div>
              <span class="popup">iPad（第 10 代）<i class="sym" data-s="chevron.up.chevron.down"></i></span>
            </div>
            <div class="row plain">
              <div class="text">名字<span class="detail">显示在远控的屏幕列表里</span></div>
              <span class="field">Snug iPad</span>
            </div>
          </div>
          <p class="sheet-tip"><i class="sym" data-s="info.circle"></i>同一时间只推一块屏。新加的屏留给横竖切换，或者换另一台设备时用。</p>
          <div class="actions"><span class="button">取消</span><span class="button prominent">添加</span></div>
        </div>
      </div>
      <figcaption><b>添加屏幕</b>和设置窗口同一种分组样式：标签在左、控件在右。先选设备，再选方向，型号列表只列这一类的；选电脑时方向固定为横。名字按型号自动起，可以改。</figcaption>
    </figure>

    <!-- 屏幕详情 -->
    <figure class="frame">
      <div class="sheet-host">
        <div class="window">
          <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><span class="title">屏幕</span></div>
          <div class="tabs"><button class="tab" aria-selected="true"><i class="sym" data-s="rectangle.on.rectangle"></i>屏幕</button><button class="tab"><i class="sym" data-s="hand.point.up.left"></i>触控</button><button class="tab"><i class="sym" data-s="gearshape"></i>通用</button></div>
          <div class="pane" style="height: 360px"></div>
        </div>
        <div class="dim"></div>
        <div class="sheet">
          <div class="row" style="padding:0">
            <span class="tile status-tile" style="--c: var(--mac-tile-screen)"><i class="sym" data-s="ipad.landscape"></i></span>
            <div class="text"><b class="sheet-name">Snug iPad</b><span class="detail">平板 · 950 × 660 点</span></div>
          </div>
          <div class="group">
            <div class="row plain">
              <div class="text">名字</div>
              <span class="field">Snug iPad</span>
            </div>
            <div class="row plain">
              <div class="text">型号</div>
              <span class="popup">iPad（第 10 代）<i class="sym" data-s="chevron.up.chevron.down"></i></span>
            </div>
            <div class="row plain">
              <div class="text">方向</div>
              <span class="value">横</span>
            </div>
          </div>
          <p class="group-note">改型号当场换比例，不用重连。方向添加后不能改。</p>
          <div class="actions"><span class="button borderless danger">删除这块屏…</span><span class="spacer"></span><span class="button prominent">完成</span></div>
        </div>
      </div>
      <figcaption><b>屏幕详情</b>一块屏自己的设置都在这里。删除放在左下、用红字，不和「完成」挨着。</figcaption>
    </figure>

    <!-- 设置 · 触控 -->
    <figure class="frame">
      <div class="window">
        <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><span class="title">触控</span></div>
        <div class="tabs"><button class="tab"><i class="sym" data-s="rectangle.on.rectangle"></i>屏幕</button><button class="tab" aria-selected="true"><i class="sym" data-s="hand.point.up.left"></i>触控</button><button class="tab"><i class="sym" data-s="gearshape"></i>通用</button></div>
        <div class="pane">
          <div class="group">
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-gestures)"><i class="sym" data-s="hand.tap.fill"></i></span>
              <div class="text">触控手势<span class="detail">单指滚动 · 长按选择 · 长按松开右键</span></div>
              <span class="toggle" role="switch" aria-checked="true"></span>
            </div>
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-zoom)"><i class="sym" data-s="textformat.size"></i></span>
              <div class="text">字号放大<span class="detail">窗口放上来时默认放大的级数</span></div>
              <span class="slider">A<span class="track"><i style="left:0"></i><i style="left:39px"></i><i style="left:79px"></i><i style="left:119px"></i><i style="left:158px"></i><span class="knob" style="left:74px"></span></span><span style="font-size:17px">A</span></span>
            </div>
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-screenshot)"><i class="sym" data-s="camera.viewfinder"></i></span>
              <div class="text">截图<span class="detail">小横条左侧的相机键 · 截当前窗口到剪贴板</span></div>
              <span class="toggle" role="switch" aria-checked="false"></span>
            </div>
          </div>
          <p class="group-note">只作用于手机和平板屏。电脑屏不翻译手势、不放大字号。</p>
        </div>
      </div>
      <figcaption><b>设置 · 触控</b>手势、字号、截图只对触屏有意义，收在一页，并写明只管手机和平板屏。</figcaption>
    </figure>

    <!-- 设置 · 通用 -->
    <figure class="frame">
      <div class="window">
        <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><span class="title">通用</span></div>
        <div class="tabs"><button class="tab"><i class="sym" data-s="rectangle.on.rectangle"></i>屏幕</button><button class="tab"><i class="sym" data-s="hand.point.up.left"></i>触控</button><button class="tab" aria-selected="true"><i class="sym" data-s="gearshape"></i>通用</button></div>
        <div class="pane">
          <div class="group">
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-launch-at-login)"><i class="sym" data-s="power"></i></span>
              <div class="text">开机启动</div>
              <span class="toggle" role="switch" aria-checked="true"></span>
            </div>
          </div>

          <div class="group-title">权限</div>
          <div class="group">
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-accessibility)"><i class="sym" data-s="hand.raised.fill"></i></span>
              <div class="text">设备控制和数据访问<span class="detail">用于移动窗口与转换手势</span></div>
              <span class="value"><i class="sym" data-s="checkmark.circle.fill" style="color: var(--mac-positive)"></i>已授权</span>
            </div>
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-screen-recording)"><i class="sym" data-s="record.circle"></i></span>
              <div class="text">录屏与系统录音<span class="detail">只有截图要用</span></div>
              <span class="button">授权…</span>
            </div>
          </div>

          <div class="group-title">更新</div>
          <div class="group">
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-update)"><i class="sym" data-s="arrow.down"></i></span>
              <div class="text">软件更新<span class="detail">已是最新版本 2.5.0</span></div>
              <span class="button">检查更新</span>
            </div>
            <div class="row">
              <span class="tile" style="--c: var(--mac-tile-update-source)"><i class="sym" data-s="server.rack"></i></span>
              <div class="text">更新源</div>
              <span class="popup">腾讯云<i class="sym" data-s="chevron.up.chevron.down"></i></span>
            </div>
          </div>
          <div class="footer"><span class="button">退出 Snug</span></div>
        </div>
      </div>
      <figcaption><b>设置 · 通用</b>开机启动、权限、更新这些和屏幕无关的，归到这一页。更新从「关于」挪过来，好找。</figcaption>
    </figure>

    <!-- 关于 -->
    <figure class="frame">
      <div class="window about">
        <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div></div>
        <div class="pane">
          <div class="hero">
            <img src="assets/apps/snug.png" alt="">
            <div>
              <h3>Snug<small>2.5.0</small></h3>
              <p>远程 Mac 的显示与触控增强</p>
              <span class="link">github.com/zephyr4123/snug</span>
            </div>
          </div>
          <div class="group-title">致谢（MIT 许可）</div>
          <div class="group">
            <div class="row plain"><div class="text"><span><span class="link">UUyc-companion</span> · AoyamaShou</span></div><span class="value">项目前身</span></div>
            <div class="row plain"><div class="text"><span><span class="link">PermissionFlow</span> · 小弟调调</span></div><span class="value">授权引导</span></div>
            <div class="row plain"><div class="text"><span><span class="link">Better Remote</span> · pincc-debug</span></div><span class="value">单指滚动思路</span></div>
            <div class="row plain"><div class="text"><span><span class="link">FreeDisplay</span> · huberdf</span></div><span class="value">虚拟屏接口声明</span></div>
          </div>
          <p class="fine">非 UU远程、CrossDesk 官方软件</p>
        </div>
      </div>
      <figcaption><b>关于</b>保持独立的小窗口，只放版本、链接、致谢。一句话介绍去掉「手机」，现在不只手机。</figcaption>
    </figure>

    <!-- 电脑屏上的 App 资源库：小竖条 + 浮层，及各状态 -->
    <figure class="frame">
      <div class="computer-screen">
        <div class="menubar">
          <span class="app-menu"><b>Ghostty</b><span>Shell</span><span>编辑</span><span>窗口</span></span>
          <span class="on"><i class="sym" data-s="iphone.radiowaves.left.and.right"></i></span>
          <i class="sym" data-s="magnifyingglass"></i>
          <span>11月24日 周二 21:05</span>
        </div>
        <div class="backdrop" style="left:830px; top:110px; width:400px; height:360px">
          <div class="titlebar"><div class="lights"><i></i><i></i><i></i></div><span class="title">~ — htop</span></div>
          <pre>  PID USER      CPU%  MEM%  COMMAND
 2041 zephyr    12.4   3.1  Ghostty
  958 zephyr     8.0   2.2  UURemoteServer
 1097 zephyr     1.2   0.9  Snug</pre>
        </div>
        <div class="lib-tab open"><i class="sym" data-s="chevron.compact.left"></i></div>
        <div class="lib-panel">
          <span class="field"><i class="sym" data-s="magnifyingglass"></i>搜索 App</span>
          <span class="segmented"><span aria-selected="true">运行中</span><span>全部</span></span>
          <div class="list">
            <div class="sect">
              <b>这块屏</b>
              <div class="item"><img src="assets/apps/ghostty.png" alt=""><div class="text"><b>~ — htop</b><span>Ghostty</span></div><span class="act">切换</span><span class="button"><i class="sym" data-s="arrow.uturn.backward"></i>还原</span></div>
              <div class="item"><img src="assets/apps/safari.png" alt=""><div class="text"><b>GitHub — snug</b><span>Safari · 全屏</span></div><span class="act">切换</span></div>
            </div>
            <div class="sect">
              <b>其他位置</b>
              <div class="item hover"><img src="assets/apps/ghostty.png" alt=""><div class="text"><b>~/projects/snug — zsh</b><span>Ghostty · 在内建屏</span></div><span class="act">放到这块屏</span></div>
              <div class="item"><img src="assets/apps/safari.png" alt=""><div class="text"><b>Swift 文档 — Concurrency</b><span>Safari · 在内建屏</span></div><span class="act">放到这块屏</span></div>
              <div class="item"><img src="assets/apps/preview.png" alt=""><div class="text"><b>截图.png</b><span>预览 · 在「Snug 手机屏」</span></div><span class="act">放到这块屏</span></div>
              <div class="item"><img src="assets/apps/notes.png" alt=""><div class="text"><b>周末计划</b><span>备忘录 · 已最小化</span></div><span class="act">放到这块屏</span></div>
            </div>
            <div class="sect">
              <b>没有窗口</b>
              <div class="item"><img src="assets/apps/calendar.png" alt=""><div class="text"><b>日历</b></div><span class="act">打开</span></div>
              <div class="item"><img src="assets/apps/mail.png" alt=""><div class="text"><b>邮件</b></div><span class="act">打开</span></div>
            </div>
          </div>
        </div>
      </div>
      <figcaption><b>运行中</b>按窗口在哪分三组，组名就是点下去会做的事；空的组不显示。整行可点，右边的动作字一直在，不靠悬停提示。没在运行的 App 在「全部」里打开，搜索时也能搜到。</figcaption>
    </figure>

    <figure class="frame">
      <div class="lib-panel">
        <span class="field"><i class="sym" data-s="magnifyingglass"></i>搜索 App</span>
        <span class="segmented"><span>运行中</span><span aria-selected="true">全部</span></span>
        <div class="list">
          <div class="grid">
            <div><img src="assets/apps/appstore.png" alt="">App Store<i></i></div>
            <div class="on"><img src="assets/apps/ghostty.png" alt="">Ghostty<i></i></div>
            <div class="on"><img src="assets/apps/safari.png" alt="">Safari<i></i></div>
            <div class="on"><img src="assets/apps/snug.png" alt="">Snug<i></i></div>
            <div class="on"><img src="assets/apps/notes.png" alt="">备忘录<i></i></div>
            <div><img src="assets/apps/maps.png" alt="">地图<i></i></div>
            <div><img src="assets/apps/finder.png" alt="">访达<i></i></div>
            <div><img src="assets/apps/calculator.png" alt="">计算器<i></i></div>
            <div class="on"><img src="assets/apps/calendar.png" alt="">日历<i></i></div>

            <div class="res-readout t-res-readout">
              <b class="res-size"></b>
              <span class="res-note"></span>
            </div>
            <div class="t-card t-res-card">
              <div class="res-slider">
                <i class="sym" data-s="textformat.size.larger"></i>
                <div class="res-track">
                  <input class="res-range" type="range" aria-label="分辨率">
                  <div class="res-ticks"></div>
                </div>
                <i class="sym" data-s="textformat.size.smaller"></i>
              </div>
            </div>
            <div class="t-res-reset res-reset">恢复默认</div>
          </div>
          <div class="t-home"><i></i></div>
        </div>
      </div>
      <figcaption><b>手机 · 调整分辨率（iPhone 17 Pro Max，竖）</b>和 Mac 上同一套：预览、点数、清晰度、滑块。预览按现在的分辨率换算，里面的字就是调好后在手机上看到的大小。拖的时候屏幕不动，手指下的滑块不会跟着缩放；点「应用」后整屏写「正在调整分辨率」，约 1 秒换好。Snug 自己的面板按屏幕放大，调完在手机上看着一样大，变的是放上来的窗口。</figcaption>
    </figure>

  </div>
</section>

</main>

<script>
// 原型里只做两件事：切浅色 / 深色；开关能拨
const root = document.documentElement;
document.querySelectorAll('[data-theme-set]').forEach((b) => b.addEventListener('click', () => {
  const v = b.dataset.themeSet;
  if (v === 'system') root.removeAttribute('data-theme'); else root.dataset.theme = v;
  document.querySelectorAll('[data-theme-set]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));
// 分辨率：预览是屏幕左上角按真实比例的一块，选的点数越多字越小、装的越多；清晰度按「2 倍像素 ÷ 屏幕像素」算
const TERM = [
  '$ swift test --parallel',
  'Building for debugging...',
  '[12/48] Compiling SnugCore ScreenFit.swift',
  '[27/48] Compiling SnugSystem VirtualDisplayService.swift',
  'Build complete! (14.82s)',
  "Test Suite 'ScreenFitTests' passed (0.031 seconds)",
  "Test Suite 'TouchTranslatorTests' passed (0.118 seconds)",
  'Executed 412 tests, with 0 failures (0 unexpected) in 3.214 seconds',
  '$ git log --oneline -5',
  'c88dc29 记忆：婉拒的建议以「不计划」关闭；不做要托管服务器的功能',
  '9c7918d 记忆：小红书文案用书面语、重点讲功能，可加轻量 emoji',
  '78e2aa9 合并 readme-sunlogin：README 收录向日葵官方适配版',
  '6ab9ab7 记忆：向日葵版按官方适配写，不必请对方改口径',
  'ec08bef README：去掉顶部向日葵图标旁的「官方适配」上标，与其他两家写法一致',
  '$ tail -f ~/Library/Logs/Snug/snug.log',
  '21:04:15 「Snug 手机屏」上线，2 倍 540×950',
  '21:04:16 Ghostty「~/projects/snug — zsh」放上手机屏，字号 +2',
  '21:04:31 远程中：UU远程，正在看「Snug 手机屏」',
  '',
];
document.querySelectorAll('[data-res]').forEach((el) => {
  const n = (k) => Number(el.dataset[k]);
  const min = n('min'), max = n('max'), native = n('native'), ratio = n('ratio'), pixels = n('pixels');
  const box = el.querySelector('.res-preview');
  const css = getComputedStyle(box);
  const boxW = parseFloat(css.getPropertyValue('--box-w')), boxH = parseFloat(css.getPropertyValue('--box-h'));
  const canvas = el.querySelector('.res-canvas');
  const range = el.querySelector('.res-range');
  const size = el.querySelector('.res-size');
  const note = el.querySelector('.res-note');
  const reset = el.querySelector('.res-reset');
  const lines = [];
  while (lines.length < 120) lines.push(...TERM);
  canvas.innerHTML = '<div class="res-menubar"><b>Ghostty</b><span>文件</span><span>编辑</span><span>显示</span><span>窗口</span><span>帮助</span></div>'
    + '<div class="res-term"><div class="res-titlebar">~/projects/snug — zsh</div><pre></pre></div>';
  canvas.querySelector('pre').textContent = lines.join('\n');
  range.min = min; range.max = max; range.step = 2;
  const pos = (w) => (w - min) / (max - min);
  el.querySelector('.res-ticks').innerHTML = `<span class="start">默认</span><span style="--t:${pos(native)}">最清晰</span>`;
  const set = (raw) => {
    let w = Math.round(raw / 10) * 10;
    if (Math.abs(raw - native) <= 12) w = native;   // 「最清晰」那一格吸住
    w = Math.min(max, Math.max(min, w));
    if (Math.abs(raw - min) <= 6) w = min;
    range.value = w;
    range.style.setProperty('--p', (pos(w) * 100) + '%');
    // 现在是默认那一档：选 w 点时，同样的内容在屏上缩成 min / w
    const k = min / w;
    canvas.style.width = (boxW / k) + 'px';
    canvas.style.height = (boxH / k) + 'px';
    canvas.style.transform = `scale(${k})`;
    const h = Math.round(w * ratio);
    size.textContent = `${w} × ${h} 点` + (w === min ? '（默认）' : '');
    const pct = Math.round(w * 2 / pixels * 100);
    if (w < native) {
      note.className = 'res-note';
      note.textContent = `画面略软 · 像素为屏幕的 ${pct}%`;
    } else {
      note.className = 'res-note ok';
      note.innerHTML = '<i class="sym" data-s="checkmark.circle.fill"></i>' + (w === native ? '最清晰 · 像素与屏幕一致' : '最清晰 · 再往右只增加空间');
    }
    if (reset) reset.style.visibility = w === min ? 'hidden' : 'visible';
  };
  range.addEventListener('input', () => set(Number(range.value)));
  if (reset) reset.addEventListener('click', () => set(min));
  set(n('start'));
});
document.querySelectorAll('.toggle').forEach((t) => t.addEventListener('click', () => {
  t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true'));
}));
</script>
</body>
</html>
